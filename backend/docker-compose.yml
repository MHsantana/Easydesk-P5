# Opcional: sobe um PostgreSQL local com Docker, já com os bancos de dev e de testes.
# Uso: docker compose up -d
services:
  postgres:
    image: postgres:16
    container_name: easydesk-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: easydesk
    ports:
      - "5432:5432"
    volumes:
      - easydesk-data:/var/lib/postgresql/data
      - ./docker/create-test-db.sql:/docker-entrypoint-initdb.d/create-test-db.sql:ro

volumes:
  easydesk-data:
